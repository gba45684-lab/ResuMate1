name: Build ResuMate APK
on:
  push:
    branches: [main, resumate-complete-rebuild]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests
        run: cd android && ./gradlew test
      - name: Build debug APK
        run: cd android && ./gradlew clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resumate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
