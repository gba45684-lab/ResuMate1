<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>ResuMate</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--brand:#4f46e5}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.logo{font-size:21px;font-weight:800}.logo span{color:var(--brand)}.top-actions,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:650}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.ghost{background:#eef2ff;color:var(--brand);border-color:transparent}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 64px)}.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;border:0;text-align:left;padding:12px 14px;border-radius:10px;color:#4b5563}.nav button.active,.nav button:hover{background:#eef2ff;color:var(--brand);font-weight:700}.content{padding:26px;max-width:1500px;width:100%;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.page-title h1{margin:0;font-size:28px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 12px #11182708}.resume-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.template-thumb{height:210px;background:#fff;border:1px solid #dbe1ea;border-radius:12px;padding:13px;overflow:hidden}.bar{height:24px;background:var(--accent,#4f46e5);border-radius:4px;margin-bottom:10px}.line{height:5px;background:#d1d5db;border-radius:3px;margin:7px 0;width:88%}.line.short{width:55%}.template-card.selected{outline:3px solid var(--brand)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff}.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;background:#fff}.editor{display:grid;grid-template-columns:minmax(360px,520px) minmax(420px,1fr);gap:22px}.section{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}.section-head{padding:12px 14px;background:#fafafa;font-weight:700}.section-body{padding:14px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}.field textarea{min-height:84px;resize:vertical}.preview-wrap{background:#dfe3e9;border-radius:16px;padding:22px;min-height:700px;overflow:auto}.paper{width:794px;min-height:1123px;margin:auto;background:#fff;padding:52px;box-shadow:0 5px 25px #0002}.paper h1{margin:0 0 5px;font-size:32px}.paper .role{font-size:15px;color:#555}.paper .contact{font-size:11px;color:#666;margin:9px 0 22px}.paper h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid var(--brand);padding-bottom:5px;margin:19px 0 9px}.paper p{font-size:11.5px;line-height:1.45}.modal-back{position:fixed;inset:0;background:#11182780;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modal{background:#fff;border-radius:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:22px}.score{font-size:44px;font-weight:850;color:var(--brand)}.meter{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden}.meter i{display:block;height:100%;background:var(--brand)}.empty{text-align:center;padding:60px 20px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.content{padding:15px}.editor{grid-template-columns:1fr}.preview-wrap{padding:8px}.paper{transform:scale(.78);transform-origin:top left;margin-bottom:-240px;margin-right:-160px}.top{padding:0 12px}}</style></head><body><div id="root"></div><script src="https://cdn.jsdelivr.net/npm/jspdf@3.0.2/dist/jspdf.umd.min.js"></script><script src="app.js"></script></body></html>
